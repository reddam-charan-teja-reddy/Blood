name: Blood Network CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run Backend Integration & Security Test Suites
        working-directory: ./server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/blood-network-test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: supersecretproductiongradejwtsecretkey1234567890
          JWT_REFRESH_SECRET: supersecretproductiongraderefreshsecretkey1234567890
          BYPASS_OTP: true
        run: |
          node test_e2e.js
          node test_redis_otp.js
          node test_concurrency_lock.js
          node test_token_revocation.js
          node test_audit_logs.js
          node test_workflow.js
          node test_admin_scopes.js
          node test_admin_scope_guardrails.js
          node test_api_integration.js

  build-frontend:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps

      - name: Build Vite SPA
        working-directory: ./client
        run: npm run build

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: blood-network-api:latest

      - name: Build Web Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: blood-network-web:latest
